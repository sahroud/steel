name: SAHROUD STEEL reference tests

on:
  push:
    branches:
      - "main"
      - "refactor/stepwise-shed-workflow"
    paths:
      - "steel2/js/**"
      - "steel2/tests/**"
      - "steel2/index.html"
      - ".github/workflows/steel2-reference-tests.yml"
  pull_request:
    paths:
      - "steel2/js/**"
      - "steel2/tests/**"
      - "steel2/index.html"
      - ".github/workflows/steel2-reference-tests.yml"

jobs:
  solver-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax of active steel2 modules
        run: |
          node --check steel2/js/analysis-3d.js
          node --check steel2/js/model-3d.js
          node --check steel2/js/auto-workflow.js
          node --check steel2/js/loads.js
          node --check steel2/js/climate-load-engine.js
          node --check steel2/js/foundation-soil-check.js
          node --check steel2/js/app.js
      - name: Run all available steel2 reference tests
        run: node --test steel2/tests/*.test.js
