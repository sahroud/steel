name: SAHROUD STEEL reference tests

on:
  push:
    branches:
      - "refactor/stepwise-shed-workflow"
    paths:
      - "steel2/js/analysis-3d.js"
      - "steel2/js/analysis-3d-worker.js"
      - "steel2/js/model-3d.js"
      - "steel2/js/load-combination-runner-3d.js"
      - "steel2/js/loads.js"
      - "steel2/js/app.js"
      - "steel2/js/design-scope.js"
      - "steel2/js/wall-foundation-transfer.js"
      - "steel2/js/foundation-soil-check.js"
      - "steel2/index.html"
      - "steel2/js/load-transfer.js"
      - "steel2/js/load-path-audit.js"
      - "steel2/js/seismic-load-path.js"
      - "steel2/js/crane-design.js"
      - "steel2/js/climate-load-engine.js"
      - "steel2/js/sections.js"
      - "steel2/js/final-report.js"
      - "steel2/js/connection-readiness.js"
      - "steel2/js/knee-connection-geometry.js"
      - "steel2/index.html"
      - "steel2/tests/**"
      - ".github/workflows/steel2-reference-tests.yml"
  pull_request:
    paths:
      - "steel2/js/analysis-3d.js"
      - "steel2/js/analysis-3d-worker.js"
      - "steel2/js/model-3d.js"
      - "steel2/js/loads.js"
      - "steel2/js/app.js"
      - "steel2/js/design-scope.js"
      - "steel2/js/load-path-audit.js"
      - "steel2/js/seismic-load-path.js"
      - "steel2/js/load-transfer.js"
      - "steel2/js/climate-load-engine.js"
      - "steel2/js/sections.js"
      - "steel2/js/final-report.js"
      - "steel2/js/connection-readiness.js"
      - "steel2/js/knee-connection-geometry.js"
      - "steel2/js/foundation-soil-check.js"
      - "steel2/tests/**"
      - ".github/workflows/steel2-reference-tests.yml"

jobs:
  solver-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax of active model and load modules
        run: |
          node --check steel2/js/model-3d.js
          node --check steel2/js/loads.js
          node --check steel2/js/app.js
          node --check steel2/js/design-scope.js
          node --check steel2/js/wall-foundation-transfer.js
          node --check steel2/js/foundation-soil-check.js
          node --check steel2/js/load-path-audit.js
          node --check steel2/js/seismic-load-path.js
          node --check steel2/js/crane-design.js
          node --check steel2/js/load-transfer.js
          node --check steel2/js/climate-load-engine.js
          node --check steel2/js/sections.js
          node --check steel2/js/final-report.js
          node --check steel2/js/connection-readiness.js
          node --check steel2/js/knee-connection-geometry.js
      - name: Run independent 3D solver reference tests
        run: node --test steel2/tests/analysis-3d-reference.test.js steel2/tests/connection-readiness.test.js steel2/tests/load-path-audit.test.js steel2/tests/wall-foundation-transfer.test.js steel2/tests/foundation-soil-check.test.js steel2/tests/foundation-soil-panel-ui.test.js steel2/tests/foundation-reaction-export.test.js
