name: SAHROUD STEEL runtime validation

on:
  push:
    branches:
      - sahroud-steel-runtime-integration-20261117ag
  pull_request:
    branches:
      - refactor/centralized-project-state-20261112

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse all JavaScript source files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find steel2/js -maxdepth 1 -type f -name '*.js' -print0)
      - name: Run engineering software regression suite
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          global.window = globalThis;
          global.addEventListener = () => {};
          global.removeEventListener = () => {};
          global.requestAnimationFrame = () => 0;
          global.cancelAnimationFrame = () => {};
          global.localStorage = {getItem: () => null, setItem: () => {}, removeItem: () => {}};
          global.sessionStorage = {getItem: () => null, setItem: () => {}, removeItem: () => {}};
          const elements = new Map();
          function mockElement(id = '') {
            return {id, value: '', checked: false, disabled: false, hidden: false, textContent: '', innerHTML: '', className: '', type: '', name: '', dataset: {}, style: {}, children: [], options: [], selectedOptions: [], classList: {add(){}, remove(){}, toggle(){return false}, contains(){return false}}, appendChild(){}, insertBefore(){}, insertAdjacentElement(){}, setAttribute(){}, getAttribute(){return null}, removeAttribute(){}, addEventListener(){}, removeEventListener(){}, querySelector(){return null}, querySelectorAll(){return []}, closest(){return null}, matches(){return false}, focus(){}, click(){}, dispatchEvent(){return true}, remove(){}, getBoundingClientRect(){return {width:0,height:0,top:0,left:0,right:0,bottom:0}}};
          }
          global.document = {
            readyState: 'loading',
            head: mockElement('head'),
            body: mockElement('body'),
            getElementById: id => { if (!elements.has(id)) elements.set(id, mockElement(id)); return elements.get(id); },
            querySelector: () => null,
            querySelectorAll: () => [],
            addEventListener: () => {},
            removeEventListener: () => {},
            createElement: tag => mockElement(tag)
          };
          vm.runInThisContext(fs.readFileSync('steel2/js/legacy-bundle.js', 'utf8'), {filename: 'legacy-bundle.js'});
          vm.runInThisContext(fs.readFileSync('steel2/js/engineering-regression-tests.js', 'utf8'), {filename: 'engineering-regression-tests.js'});
          const result = global.SteelEngineeringRegression.run();
          console.log(`Software regression: ${result.passed}/${result.passed + result.failed} passed`);
          for (const check of result.checks.filter(x => !x.pass)) console.error('FAIL:', check.name, check.detail);
          if (result.failed) process.exit(1);
          NODE
      - name: Verify production bundle manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const bundle = fs.readFileSync('steel2/js/legacy-bundle.js', 'utf8');
          const html = fs.readFileSync('steel2/legacy.html', 'utf8');
          const headers = [...bundle.matchAll(/\/\* ===== (steel2\/js\/[^=]+) ===== \*\//g)].map(x => x[1]);
          const names = headers.map(x => path.basename(x));
          const duplicates = names.filter((x, i) => names.indexOf(x) !== i);
          const required = [
            'project.js','loads.js','analysis-3d.js','analysis.js','model-3d.js',
            'design-core.js','m6-load-combination-templates.js','member-design-demand-package.js',
            'crane-3d-load-transfer.js','foundation-reaction-bridge.js','runtime-integrity.js','solver-end-action-sign-benchmarks.js'
          ];
          const excluded = [
            'dropbox-integration.js','engineering-workstream-dashboard.js',
            'tapered-fabrication-economics.js','tapered-fabrication-ui.js'
          ];
          const missing = required.filter(x => !names.includes(x));
          const unexpectedlyIncluded = excluded.filter(x => names.includes(x));
          const missingSources = headers.filter(x => !fs.existsSync(x));
          if (!headers.length || duplicates.length || missing.length || unexpectedlyIncluded.length || missingSources.length) {
            console.error({moduleCount: names.length, duplicates, missing, unexpectedlyIncluded, missingSources});
            process.exit(1);
          }
          if (!html.includes('js/legacy-bundle.js?v=20261117-runtime4') || html.includes('dropbox@')) {
            console.error('Legacy page does not reference the current single runtime bundle or still loads the external Dropbox SDK.');
            process.exit(1);
          }
          if (!bundle.includes('SteelRuntimeIntegrity')) {
            console.error('Runtime integrity gate is missing from the production bundle.');
            process.exit(1);
          }
          console.log('Runtime manifest OK:', names.length, 'modules; all source files exist; required engineering modules present.');
          NODE
